worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend {
		server localhost:5000 max_fails=3 fail_timeout=30s;
		server localhost:5001 max_fails=3 fail_timeout=30s;
}

server {
    listen 8080;

    location /counter {
        proxy_pass http://backend;
    }
}
}